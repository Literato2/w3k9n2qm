<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Crecimiento</title>
  <style>
    :root { --bg:#f3eee6; --paper:#fffaf3; --ink:#2c2622; --muted:#7a7068; --line:#e4d9cc; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #fbe7d6 0%, transparent 50%),
        radial-gradient(900px 400px at 110% 0%, #d9ece8 0%, transparent 45%),
        var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 24px;
    }
    form {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 24px;
      width: min(360px, 100%);
      box-shadow: 0 10px 30px rgba(60, 40, 20, 0.08);
      text-align: center;
    }
    h1 { font-family: Georgia, Palatino, serif; font-size: 1.35rem; margin: 0 0 6px; font-weight: 600; }
    p { color: var(--muted); margin: 0 0 16px; font-size: 0.92rem; }
    input {
      width: 100%; font: inherit; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--line); margin-bottom: 12px;
    }
    button {
      width: 100%; font: inherit; border: 0; background: var(--ink); color: #fffaf3;
      border-radius: 999px; padding: 10px 16px; cursor: pointer;
    }
    #err { color: #a33b2a; min-height: 1.2em; margin: 10px 0 0; }
  </style>
</head>
<body>
  <form id="f">
    <h1>Crecimiento</h1>
    <p>Clave para ver las curvas.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Clave" autofocus>
    <button type="submit">Entrar</button>
    <p id="err" hidden>Clave incorrecta</p>
  </form>

  async function openPage(html) {
    document.open();
    document.write(html);
    document.close();
  }
  async function decrypt(pw) {
    const bin = Uint8Array.from(atob(PAYLOAD), (c) => c.charCodeAt(0));
    const salt = bin.slice(0, 16);
    const iv = bin.slice(16, 28);
    const data = bin.slice(28);
    const enc = new TextEncoder();
    const material = await crypto.subtle.importKey(
      "raw", enc.encode(pw.normalize("NFKC").trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
    return new TextDecoder().decode(plain);
  }
  const KEY = "crecimiento-ok";
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("err");
    try {
      const html = await decrypt(document.getElementById("pw").value);
      sessionStorage.setItem(KEY, "1");
      await openPage(html);
    } catch (ex) {
      err.hidden = false;
    }
  });
  </script>
